# Drop-in .github/workflows/release.yml (see README.md here): on a v* tag,
# build every artifact and attach it to a draft GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04   # oldest glibc we want to support
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvulkan-dev libx11-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev libssl-dev file
      - name: Test
        run: zig build test
      - name: Release archive + AppImage/.deb/.rpm
        run: zig build release -Dpackages=true -Dversion=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            zig-out/release/*.tar.gz
            zig-out/release/*.AppImage
            zig-out/release/*.deb
            zig-out/release/*.rpm

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-windows, aarch64-macos, x86_64-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
      - name: Release archive
        run: zig build release -Dtarget=${{ matrix.target }} -Dversion=${GITHUB_REF_NAME#v}
      - name: macOS .app
        if: contains(matrix.target, 'macos')
        run: bash packaging/macos/make-app.sh zig-out/release/deathterminal-*-macos zig-out/release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            zig-out/release/*.zip
            zig-out/release/*.tar.gz

  publish:
    needs: [linux, cross]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
