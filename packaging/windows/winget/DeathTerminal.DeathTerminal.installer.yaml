# winget installer manifest. Portable zip from a future release.
# packaging/update-manifests.sh fills the version and InstallerSha256.
# InstallerUrl stays example.invalid until that file exists. This does not
# point at a GitHub Release.
PackageIdentifier: DeathTerminal.DeathTerminal
PackageVersion: "@@VERSION@@"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: deathterminal-@@VERSION@@-x86_64-windows\deathterminal.exe
    PortableCommandAlias: deathterminal
Installers:
  - Architecture: x64
    InstallerUrl: https://example.invalid/pending-release/deathterminal-@@VERSION@@-x86_64-windows.zip
    InstallerSha256: "@@SHA256:deathterminal-@@VERSION@@-x86_64-windows.zip@@"
  - Architecture: arm64
    InstallerUrl: https://example.invalid/pending-release/deathterminal-@@VERSION@@-aarch64-windows.zip
    InstallerSha256: "@@SHA256:deathterminal-@@VERSION@@-aarch64-windows.zip@@"
    NestedInstallerFiles:
      - RelativeFilePath: deathterminal-@@VERSION@@-aarch64-windows\deathterminal.exe
        PortableCommandAlias: deathterminal
MinimumOSVersion: 10.0.17763.0
ManifestType: installer
ManifestVersion: 1.6.0
