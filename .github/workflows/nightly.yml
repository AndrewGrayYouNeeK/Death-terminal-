# Publish macOS binaries on a rolling orphan branch named nightly.
# No tags and no GitHub Releases. install.sh downloads them from
# https://media.githubusercontent.com/media/AndrewGrayYouNeeK/Death-terminal-/nightly/macos/<arch>/deathterminal
# The branch is one commit, replaced on every push to main, so the binary
# history does not grow.
name: Nightly macOS binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'AndrewGrayYouNeeK/Death-terminal-'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Build ReleaseSafe ${{ matrix.arch }}-macos
        run: zig build -Dtarget=${{ matrix.arch }}-macos -Doptimize=ReleaseSafe

      - name: Record checksum
        run: |
          mkdir -p "out/macos/${{ matrix.arch }}"
          cp zig-out/bin/deathterminal "out/macos/${{ matrix.arch }}/deathterminal"
          chmod 755 "out/macos/${{ matrix.arch }}/deathterminal"
          sha256sum "out/macos/${{ matrix.arch }}/deathterminal" | awk '{ print $1 }' > "out/macos/${{ matrix.arch }}/deathterminal.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/macos/${{ matrix.arch }}/

  publish:
    if: github.repository == 'AndrewGrayYouNeeK/Death-terminal-'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Push the rolling nightly branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p nightly-src/macos
          cp -a artifacts/macos-aarch64/. nightly-src/macos/aarch64/
          cp -a artifacts/macos-x86_64/. nightly-src/macos/x86_64/
          cd nightly-src
          git init -b nightly
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add macos
          git commit -m "Nightly macOS binaries from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:nightly
