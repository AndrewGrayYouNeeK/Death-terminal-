# Drop-in replacement for .github/workflows/ci.yml (see README.md here).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH

      # Fonts (#26): freetype/harfbuzz/fontconfig. SSH: libssl (libcrypto).
      # Vulkan headers are vendored now; libvulkan-dev is only for the loader.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvulkan-dev mesa-vulkan-drivers \
            libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libssl-dev \
            fonts-dejavu-core vttest

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  cross:
    # Compile-only checks: nothing runs on these targets here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-windows, aarch64-macos, x86_64-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
      - name: Cross-compile
        run: zig build -Dtarget=${{ matrix.target }}
