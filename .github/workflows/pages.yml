# GitHub Pages. The copy to edit is packaging/ci/pages.yml; the installed
# file is .github/workflows/pages.yml (keep them identical).
# Publishes /site on push to main with actions/deploy-pages.
#
# actions/configure-pages prepares the deployment (site URL, base path).
# Its enablement input can create a Pages site, but only with a token
# other than GITHUB_TOKEN (it needs administration:write). This workflow
# leaves enablement off. The owner sets Settings > Pages > Source to
# "GitHub Actions" once. Until that is set, this deploy fails; re-run it
# after the source is GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
