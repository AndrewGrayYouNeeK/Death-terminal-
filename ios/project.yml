name: DeathTerminal
options:
  bundleIdPrefix: com.github.andrewgrayyouneek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4NJ8T765L2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  # Citadel builds on this fork of swift-nio-ssh; it must be the same URL.
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh
    minVersion: 0.3.4
    maxVersion: 0.4.0
targets:
  DeathTerminal:
    type: application
    platform: iOS
    sources:
      - path: DeathTerminal
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.andrewgrayyouneek.deathterminal.ios
        PRODUCT_NAME: DeathTerminal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Death Terminal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Death Terminal connects to SSH servers on your local network."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
schemes:
  DeathTerminal:
    build:
      targets:
        DeathTerminal: all
    run:
      config: Debug
    archive:
      config: Release
